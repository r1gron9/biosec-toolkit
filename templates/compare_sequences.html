<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Compare DNA Sequences</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Compare DNA Sequences</h1>
        <p>This tool compares two DNA sequences from different optimization tools, highlights their codon-level differences, and checks for TATAAT promoter motifs in the reverse complement.</p>
        <form method="post">
            <label>Optimizer 1 Name:</label>
            <input type="text" name="optimizer1" placeholder="e.g., Tool A" required>

            <label>Optimizer 2 Name:</label>
            <input type="text" name="optimizer2" placeholder="e.g., Tool B" required>

            <label>Sequence from Optimizer 1:</label>
            <textarea name="sequence1" rows="5" required></textarea>

            <label>Sequence from Optimizer 2:</label>
            <textarea name="sequence2" rows="5" required></textarea>

            <button type="submit">Compare</button>
        </form>

        {% if result %}
        <div class="section">
            <h2>Results</h2>
            <div>{{ result|safe }}</div>
        </div>
        {% endif %}
        <br>
        <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>

    </div>
</body>
</html>
